<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "DejaVu Sans", sans-serif; }
  svg text { font-family: "DejaVu Sans", sans-serif; fill: #222; }
  .title { font-size: 26px; font-weight: bold; }
  .sub { font-size: 15px; fill: #555; }
  .lbl { font-size: 16px; font-weight: bold; }
  .sm { font-size: 14px; fill: #444; }
  .warn { font-size: 14px; fill: #c0392b; font-weight: bold; }
  .ok { font-size: 14px; fill: #b8740a; font-weight: bold; }
  .box { fill: #f4f5f7; stroke: #333; stroke-width: 2; }
  .assumed { fill: #fafafa; stroke: #777; stroke-width: 2; stroke-dasharray: 7 5; }
  .gasbox { fill: #fdeceb; stroke: #c0392b; stroke-width: 2; }
  .hot { stroke: #222; stroke-width: 4; fill: none; }
  .yel { stroke: #d4a017; stroke-width: 4; fill: none; }
  .lv { stroke: #2a6fdb; stroke-width: 3; fill: none; }
  .tc { stroke: #e67e22; stroke-width: 3; fill: none; }
  .splice { fill: #efe6d2; stroke: #8a7c5c; stroke-width: 2; }
  .divider { stroke: #ddd; stroke-width: 2; }
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
  <defs>
    <g id="outlet">
      <rect x="0" y="0" width="140" height="62" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
      <rect x="14" y="18" width="5" height="16" fill="#333"/>
      <rect x="30" y="18" width="5" height="16" fill="#333"/>
      <path d="M20 44 a4.5 4.5 0 0 1 9 0 v4 h-9 z" fill="#333"/>
    </g>
  </defs>

  <!-- ================= PANEL 1 ================= -->
  <text x="30" y="42" class="title">1 · How your ST-TRC is wired</text>
  <text x="30" y="68" class="sub">From the ST-TRC installer's manual (Fig. 33) and Heat &amp; Glo's DSI guide, matched to your photos.</text>

  <!-- hot bus -->
  <text x="60" y="108" text-anchor="middle" class="lbl">120 V in</text>
  <text x="60" y="126" text-anchor="middle" class="sm">(hot)</text>
  <path d="M60 135 V450" class="hot"/>
  <text x="46" y="350" class="sm" transform="rotate(-90 46 350)" text-anchor="middle">junction box</text>

  <!-- Rung 1: REM -->
  <path d="M60 170 H560" class="hot"/>
  <use href="#outlet" x="560" y="139"/>
  <text x="660" y="168" text-anchor="middle" class="lbl">REM</text>
  <text x="660" y="188" text-anchor="middle" class="sm">always on</text>
  <text x="715" y="160" class="ok">← blower is plugged in here now,</text>
  <text x="730" y="180" class="ok">so it runs full blast</text>
  <text x="300" y="160" text-anchor="middle" class="sm">straight from the house power, no control</text>

  <!-- Rung 2: FAN via knob -->
  <path d="M60 270 H105" class="hot"/>
  <rect x="105" y="256" width="40" height="28" rx="12" class="splice"/>
  <text x="125" y="276" text-anchor="middle" class="lbl">A</text>
  <path d="M145 270 H170" class="hot"/>
  <rect x="170" y="230" width="140" height="80" rx="8" class="box"/>
  <path d="M182 270 l10 0 l6 -12 l11 24 l11 -24 l11 24 l11 -24 l11 24 l11 -24 l6 12 l10 0" stroke="#222" stroke-width="3" fill="none"/>
  <path d="M205 296 L268 244" stroke="#222" stroke-width="2.5"/>
  <path d="M268 244 l-11 2 l7 7 z" fill="#222"/>
  <text x="240" y="330" text-anchor="middle" class="lbl">① Speed knob</text>
  <path d="M310 270 H330" class="hot"/>
  <rect x="330" y="256" width="40" height="28" rx="12" class="splice"/>
  <text x="350" y="276" text-anchor="middle" class="lbl">B</text>
  <path d="M370 270 H400" class="hot"/>
  <rect x="400" y="232" width="135" height="76" rx="8" class="box" style="fill:#fff4e0;stroke:#b8740a"/>
  <circle cx="420" cy="270" r="5" fill="#222"/>
  <circle cx="515" cy="270" r="5" fill="#222"/>
  <path d="M420 270 L505 246" stroke="#222" stroke-width="3"/>
  <text x="467" y="298" text-anchor="middle" class="sm">closes ~120°F</text>
  <text x="467" y="330" text-anchor="middle" class="lbl">Temp sensor switch</text>
  <text x="467" y="348" text-anchor="middle" class="warn">prime suspect (#15/#16)</text>
  <path d="M535 270 H560" class="hot"/>
  <use href="#outlet" x="560" y="239"/>
  <text x="660" y="268" text-anchor="middle" class="lbl">FAN</text>
  <text x="660" y="288" text-anchor="middle" class="sm">switched</text>
  <text x="715" y="260" class="warn">← blower's normal spot,</text>
  <text x="730" y="280" class="warn">no power right now</text>

  <!-- Burner side -->
  <rect x="160" y="372" width="810" height="128" rx="10" fill="#fdf3f2" stroke="#e8b4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="180" y="394" class="warn">Burner side: leave alone</text>
  <!-- Rung 3: on/off switch -->
  <path d="M60 425 H180" class="hot"/>
  <rect x="180" y="404" width="150" height="44" rx="8" class="box"/>
  <text x="255" y="432" text-anchor="middle" class="lbl">On/off (#20)</text>
  <path d="M330 425 H560" class="yel"/>
  <text x="445" y="416" text-anchor="middle" class="sm">yellow (#7)</text>
  <text x="445" y="452" text-anchor="middle" class="sm">+ wall switch (#21, #22)</text>
  <!-- Rung 4: module power -->
  <path d="M60 450 V478 H560" class="hot"/>
  <text x="230" y="470" text-anchor="middle" class="sm">black</text>
  <rect x="560" y="404" width="140" height="86" rx="8" class="gasbox"/>
  <text x="630" y="432" text-anchor="middle" class="lbl">RAM module</text>
  <text x="630" y="452" text-anchor="middle" class="sm">#6, ignition</text>
  <text x="630" y="472" text-anchor="middle" class="sm">controller</text>
  <path d="M700 447 H740" stroke="#c0392b" stroke-width="3"/>
  <rect x="740" y="404" width="215" height="86" rx="8" class="gasbox"/>
  <text x="847" y="432" text-anchor="middle" class="lbl">Gas valve (#17)</text>
  <text x="847" y="452" text-anchor="middle" class="sm">spark ignitor,</text>
  <text x="847" y="472" text-anchor="middle" class="sm">flame sensor</text>

  <!-- notes -->
  <text x="30" y="535" class="sm">• Neutral (white) and ground (green) return to the junction box and aren't drawn.</text>
  <text x="30" y="559" class="sm">• The RAM module lights and watches the burner. It isn't a temperature sensor and has no fan wires.</text>
  <text x="30" y="583" class="sm">• FAN only gets power when the knob is on AND the temp sensor switch (GFK-160A fan kit) is hot: it closes</text>
  <text x="44" y="605" class="sm">around 120°F and opens around 90°F. With FAN dead, that switch or its loose lead (#16) is the likeliest cause.</text>

  <line x1="30" y1="635" x2="970" y2="635" class="divider"/>

  <!-- ================= PANEL 2 ================= -->
  <g transform="translate(0,40)">
  <text x="30" y="640" class="title">2 · With the Pico (no wiring changes)</text>
  <text x="30" y="666" class="sub">The relay plugs into REM, the blower plugs into the relay. The Pico decides when the blower runs.</text>

  <!-- Probe chain (top row) -->
  <rect x="330" y="700" width="150" height="70" rx="8" class="box"/>
  <text x="405" y="731" text-anchor="middle" class="lbl">Pi Pico</text>
  <text x="405" y="752" text-anchor="middle" class="sm">main.py</text>

  <rect x="560" y="700" width="140" height="70" rx="8" class="box"/>
  <text x="630" y="731" text-anchor="middle" class="lbl">MAX6675</text>
  <text x="630" y="752" text-anchor="middle" class="sm">board</text>
  <path d="M480 735 H560" class="lv"/>
  <text x="520" y="725" text-anchor="middle" class="sm">SPI</text>

  <rect x="780" y="690" width="190" height="90" rx="8" class="box" style="fill:#fdf1e6"/>
  <text x="875" y="722" text-anchor="middle" class="lbl">Thermocouple</text>
  <text x="875" y="743" text-anchor="middle" class="sm">clamped to the</text>
  <text x="875" y="762" text-anchor="middle" class="sm">firebox underside</text>
  <path d="M700 735 H780" class="tc"/>
  <text x="740" y="725" text-anchor="middle" class="sm">probe</text>

  <!-- USB charger -->
  <rect x="330" y="810" width="150" height="46" rx="8" class="box"/>
  <text x="405" y="839" text-anchor="middle" class="lbl">USB charger</text>
  <path d="M405 810 V770" class="lv"/>

  <!-- Relay -->
  <rect x="40" y="730" width="230" height="290" rx="10" class="box" style="fill:#eef3fb"/>
  <text x="155" y="765" text-anchor="middle" class="lbl">IoT Relay</text>
  <rect x="120" y="718" width="70" height="24" rx="4" fill="#3a9d5d" stroke="#222" stroke-width="1.5"/>
  <text x="155" y="735" text-anchor="middle" style="font-size:13px;font-weight:bold;fill:#fff">+   −</text>
  <path d="M330 735 H300 V706 H155 V718" class="lv"/>
  <text x="300" y="696" text-anchor="middle" class="sm" style="fill:#2a6fdb">GP15→+  GND→−</text>

  <text x="60" y="838" class="sm">Always ON</text>
  <path d="M175 833 H330" class="hot"/>
  <text x="60" y="918" class="lbl">Normally ON</text>
  <text x="60" y="988" class="sm" style="fill:#999">Normally OFF (empty)</text>

  <!-- REM outlet feeding relay -->
  <use href="#outlet" x="85" y="1060"/>
  <text x="185" y="1089" text-anchor="middle" class="lbl">REM</text>
  <text x="185" y="1107" text-anchor="middle" class="sm">outlet</text>
  <path d="M155 1060 V1020" class="hot"/>

  <!-- Blower chain -->
  <path d="M190 913 H850" class="hot"/>
  <text x="520" y="903" text-anchor="middle" class="sm">blower's own plug and cord</text>
  <circle cx="890" cy="913" r="40" class="box"/>
  <text x="890" y="923" text-anchor="middle" style="font-size:28px;font-weight:bold">M</text>
  <text x="890" y="975" text-anchor="middle" class="lbl">Blower</text>

  <text x="300" y="1010" class="sm">• Pico off or crashed → the "Normally ON" outlet stays on → blower runs (fail-safe).</text>
  <text x="300" y="1034" class="sm">• Blue = 3.3 V wiring. All 120 V stays inside cords and the sealed relay.</text>
  <text x="300" y="1058" class="sm">• The blower runs full speed when on, since the knob isn't in this path.</text>
  <text x="314" y="1082" class="sm">For speed control, the FAN outlet has to work again first.</text>
  <text x="300" y="1106" class="sm">• Keep the relay, charger and Pico where they stay cool (not on hot metal).</text>
  </g>
</svg>
</body></html>
